services:
  postgres:
    image: postgres:17
    container_name: codearena-postgres
    environment:
      POSTGRES_DB: codearena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - codearena_data:/var/lib/postgresql/data

volumes:
  codearena_data: